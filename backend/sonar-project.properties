# Identificador único e organização no SonarCloud
sonar.projectKey=anacardozo_projeto-monorepo
sonar.organization=anacardozo
sonar.projectName=projeto-monorepo

# Diretório que contém o código-fonte da aplicação
sonar.sources=src

# Padrões de arquivos de teste
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts

# Caminho do relatório de cobertura (LCOV, gerado pelo Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Pastas que não devem ser inspecionadas
sonar.exclusions=coverage/**,node_modules/**,dist/**

# Codificação
sonar.sourceEncoding=UTF-8